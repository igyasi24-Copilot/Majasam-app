<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://majasam.com/email-confirmed.html">
  <title>Email confirmed - MajaSam</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0a0e17; color: #eef0f7; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; }
    .check { width: 84px; height: 84px; border-radius: 50%; background: rgba(47,181,107,0.18); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 44px; color: #2fb56b; }
    h1 { font-size: 1.7rem; margin: 0 0 12px; }
    p { font-size: 1.05rem; line-height: 1.6; color: #b9c0d4; margin: 0 0 24px; }
    a.button { display: inline-block; background: #2f6bff; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 28px; border-radius: 14px; }
    small { display: block; margin-top: 28px; color: #7f8aa3; line-height: 1.5; }
    small a { color: #8fb0ff; }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Your email is confirmed</h1>
    <p>Your MajaSam account is ready. Open the app and sign in with your email and password.</p>
    <a class="button" href="majasam://">Open MajaSam</a>
    <small>On a computer? Open MajaSam on your iPhone and sign in there.<br>Something wrong? Email <a href="mailto:support@majasam.com">support@majasam.com</a>.</small>
  </main>
</body>
</html>
